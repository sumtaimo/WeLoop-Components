<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>WeLoop 2.1 — Component Library</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
    <style>
      *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
      body { font-family: Inter, sans-serif; background: #f9fafb; color: #171717; }

      /* ── Utilities ───────────────────────────────────────── */
      @keyframes weloop-spin { from { transform: rotate(0deg); } to { transform: rotate(360deg); } }
      .wl-spin { animation: weloop-spin 1s linear infinite; }

      /* ── Dialog / overlay ────────────────────────────────── */
      @keyframes wl-overlay-show { from { opacity: 0; } to { opacity: 1; } }
      @keyframes wl-overlay-hide { from { opacity: 1; } to { opacity: 0; } }
      @keyframes wl-dialog-show  { from { opacity: 0; transform: translateY(10px) scale(0.97); } to { opacity: 1; transform: translateY(0) scale(1); } }
      @keyframes wl-dialog-hide  { from { opacity: 1; transform: translateY(0) scale(1); } to { opacity: 0; transform: translateY(10px) scale(0.97); } }
      .wl-dialog-overlay[data-state="open"]   { animation: wl-overlay-show 0.18s ease; }
      .wl-dialog-overlay[data-state="closed"] { animation: wl-overlay-hide 0.14s ease; }
      .wl-dialog-content[data-state="open"]   { animation: wl-dialog-show  0.22s cubic-bezier(0.34,1.26,0.64,1); }
      .wl-dialog-content[data-state="closed"] { animation: wl-dialog-hide  0.14s ease; }

      /* ── Select dropdown ─────────────────────────────────── */
      @keyframes wl-select-show { from { opacity: 0; transform: translateY(-4px); } to { opacity: 1; transform: translateY(0); } }
      @keyframes wl-select-hide { from { opacity: 1; transform: translateY(0); } to { opacity: 0; transform: translateY(-4px); } }
      .wl-select-content[data-state="open"]   { animation: wl-select-show 0.15s ease; }
      .wl-select-content[data-state="closed"] { animation: wl-select-hide 0.10s ease; }

      /* ── Tooltip ─────────────────────────────────────────── */
      @keyframes wl-tooltip-show { from { opacity: 0; transform: translateY(3px) scale(0.95); } to { opacity: 1; transform: translateY(0) scale(1); } }
      @keyframes wl-tooltip-hide { from { opacity: 1; transform: translateY(0) scale(1); } to { opacity: 0; transform: translateY(3px) scale(0.95); } }
      .wl-tooltip[data-state="instant-open"], .wl-tooltip[data-state="delayed-open"] { animation: wl-tooltip-show 0.12s ease; }
      .wl-tooltip[data-state="closed"] { animation: wl-tooltip-hide 0.08s ease; }

      /* ── Dropdown menu ───────────────────────────────────── */
      @keyframes wl-dropdown-show { from { opacity: 0; transform: translateY(-4px) scaleY(0.96); transform-origin: top; } to { opacity: 1; transform: translateY(0) scaleY(1); transform-origin: top; } }
      @keyframes wl-dropdown-hide { from { opacity: 1; transform: translateY(0) scaleY(1); transform-origin: top; } to { opacity: 0; transform: translateY(-4px) scaleY(0.96); transform-origin: top; } }
      .wl-dropdown[data-state="open"]   { animation: wl-dropdown-show 0.15s cubic-bezier(0.16,1,0.3,1); }
      .wl-dropdown[data-state="closed"] { animation: wl-dropdown-hide 0.10s ease; }

      /* ── Checkbox check stroke animation ─────────────────── */
      @keyframes wl-check-in  { from { stroke-dashoffset: 20; opacity: 0; } to { stroke-dashoffset: 0; opacity: 1; } }
      .wl-check-path  { stroke-dasharray: 20; animation: wl-check-in 0.18s cubic-bezier(0.34,1.26,0.64,1); }
      .wl-minus-path  { animation: wl-check-in 0.14s ease; }

      /* ── Toast ───────────────────────────────────────────── */
      @keyframes wl-toast-in-right  { from { opacity: 0; transform: translateX(110%); } to { opacity: 1; transform: translateX(0); } }
      @keyframes wl-toast-out-right { from { opacity: 1; transform: translateX(0);    } to { opacity: 0; transform: translateX(110%); } }
      @keyframes wl-toast-in-left   { from { opacity: 0; transform: translateX(-110%);} to { opacity: 1; transform: translateX(0); } }
      @keyframes wl-toast-out-left  { from { opacity: 1; transform: translateX(0);    } to { opacity: 0; transform: translateX(-110%); } }
      @keyframes wl-toast-in-top    { from { opacity: 0; transform: translateY(-110%);} to { opacity: 1; transform: translateY(0); } }
      @keyframes wl-toast-out-top   { from { opacity: 1; transform: translateY(0);    } to { opacity: 0; transform: translateY(-110%); } }
      @keyframes wl-toast-in-bottom { from { opacity: 0; transform: translateY(110%); } to { opacity: 1; transform: translateY(0); } }
      @keyframes wl-toast-out-bottom{ from { opacity: 1; transform: translateY(0);    } to { opacity: 0; transform: translateY(110%); } }

      /* applied by position variant */
      .wl-toast[data-state="open"][data-pos="bottom-right"],
      .wl-toast[data-state="open"][data-pos="top-right"]  { animation: wl-toast-in-right  0.28s cubic-bezier(0.34,1.26,0.64,1); }
      .wl-toast[data-state="closed"][data-pos="bottom-right"],
      .wl-toast[data-state="closed"][data-pos="top-right"]{ animation: wl-toast-out-right 0.20s ease; }

      .wl-toast[data-state="open"][data-pos="bottom-left"],
      .wl-toast[data-state="open"][data-pos="top-left"]   { animation: wl-toast-in-left   0.28s cubic-bezier(0.34,1.26,0.64,1); }
      .wl-toast[data-state="closed"][data-pos="bottom-left"],
      .wl-toast[data-state="closed"][data-pos="top-left"] { animation: wl-toast-out-left  0.20s ease; }

      .wl-toast[data-state="open"][data-pos="top-center"]    { animation: wl-toast-in-top    0.28s cubic-bezier(0.34,1.26,0.64,1); }
      .wl-toast[data-state="closed"][data-pos="top-center"]  { animation: wl-toast-out-top   0.20s ease; }
      .wl-toast[data-state="open"][data-pos="bottom-center"] { animation: wl-toast-in-bottom 0.28s cubic-bezier(0.34,1.26,0.64,1); }
      .wl-toast[data-state="closed"][data-pos="bottom-center"]{ animation: wl-toast-out-bottom 0.20s ease; }

      /* ── Snackbar ────────────────────────────────────────── */
      @keyframes wl-snackbar-in-up    { from { opacity: 0; transform: translateY(14px) scale(0.97); } to { opacity: 1; transform: translateY(0) scale(1); } }
      @keyframes wl-snackbar-out-down { from { opacity: 1; transform: translateY(0)    scale(1); }   to { opacity: 0; transform: translateY(14px) scale(0.97); } }
      @keyframes wl-snackbar-in-down  { from { opacity: 0; transform: translateY(-14px) scale(0.97); } to { opacity: 1; transform: translateY(0) scale(1); } }
      @keyframes wl-snackbar-out-up   { from { opacity: 1; transform: translateY(0)     scale(1); }   to { opacity: 0; transform: translateY(-14px) scale(0.97); } }

      .wl-snackbar[data-state="open"][data-pos^="bottom"]   { animation: wl-snackbar-in-up    0.30s cubic-bezier(0.34,1.26,0.64,1); }
      .wl-snackbar[data-state="closed"][data-pos^="bottom"] { animation: wl-snackbar-out-down 0.20s ease; }
      .wl-snackbar[data-state="open"][data-pos^="top"]      { animation: wl-snackbar-in-down  0.30s cubic-bezier(0.34,1.26,0.64,1); }
      .wl-snackbar[data-state="closed"][data-pos^="top"]    { animation: wl-snackbar-out-up   0.20s ease; }

      /* ── Popover ─────────────────────────────────────────── */
      @keyframes wl-popover-show { from { opacity: 0; transform: scale(0.95); } to { opacity: 1; transform: scale(1); } }
      @keyframes wl-popover-hide { from { opacity: 1; transform: scale(1); }   to { opacity: 0; transform: scale(0.95); } }
      .wl-popover[data-state="open"]   { animation: wl-popover-show 0.15s cubic-bezier(0.34,1.26,0.64,1); }
      .wl-popover[data-state="closed"] { animation: wl-popover-hide 0.10s ease; }

      /* ── Accordion ───────────────────────────────────────── */
      @keyframes wl-accordion-open  { from { height: 0; opacity: 0; } to { height: var(--radix-accordion-content-height); opacity: 1; } }
      @keyframes wl-accordion-close { from { height: var(--radix-accordion-content-height); opacity: 1; } to { height: 0; opacity: 0; } }
      .wl-accordion-content[data-state="open"]   { animation: wl-accordion-open  0.22s cubic-bezier(0.34,1.26,0.64,1); overflow: hidden; }
      .wl-accordion-content[data-state="closed"] { animation: wl-accordion-close 0.18s ease; overflow: hidden; }
      .wl-accordion [data-state="open"]  .wl-accordion-chevron { transform: rotate(180deg); }
      .wl-accordion [data-state="closed"] .wl-accordion-chevron { transform: rotate(0deg); }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/showcase/main.tsx"></script>
  </body>
</html>
